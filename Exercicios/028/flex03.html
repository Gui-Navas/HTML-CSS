<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flex Box</title>
    <style>
        
div#grande {
    background-color: black;
    width: 600px;
    height: 250px;
    color: rgb(0, 0, 0);
    display: flex;
    flex-direction: row;
}

div#pequeno {
    background-color: lightgrey;
    width: 300px;
    height: 40px;
    text-align: center;
    font-weight: bolder;

    margin: 10px;
    border-radius: 20px;
    padding: 10px;
}

    </style>
</head>
<body>
    <div id="grande">
        <div id="pequeno">A</div>
        <div id="pequeno">B</div>
        <div id="pequeno">C</div>
        <div id="pequeno">D</div>
    </div>
</body>
</html>
