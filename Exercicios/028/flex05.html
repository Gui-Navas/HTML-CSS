<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flex Box</title>
    <style>
* {
    margin: 0px;
    padding: 0px;
}
        
div#grande {
    background-color: black;
    color: rgb(0, 0, 0);

    display: flex;
    flex-flow: row wrap;
    align-content: flex-start;
    height: 400px;
}

div#pequeno {
    background-color: lightgrey;
    text-align: center;
    font-weight: bolder;

    border: 3px solid blue;
    padding: 40px;

}

    </style>
</head>
<body>
    <div id="grande">
        <div id="pequeno">A</div>
        <div id="pequeno">B</div>
        <div id="pequeno">C</div>
        <div id="pequeno">D</div>
        <div id="pequeno">E</div>
        <div id="pequeno">F</div>
        <div id="pequeno">G</div>
    </div>
</body>
</html>
