<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flex Box</title>
    <style>
        
div#grande {
    background-color: black;

    display: flex;
    flex-flow: row nowrap;
}

div#pequeno {
    background-color: lightgrey;

    border: 2px solid blue;
    text-align: center;
    flex-basis: 200px;
}

div.i1 {
    flex-shrink: 1;
    flex-grow: 1;
}

div.i2 {
    flex-shrink: 1;
    flex-grow: 4;
}

div.i3 {
    flex-shrink: 1;  
    flex-grow: 0;
}
    </style>
</head>
<body>
    <div id="grande">
        <div id="pequeno" class="i1">A</div>
        <div id="pequeno" class="i2">B</div>
        <div id="pequeno" class="i3">C</div>
    </div>
</body>
</html>
