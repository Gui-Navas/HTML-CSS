<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container {
            border: 3px solid blue;
            display: grid;
            gap: 10px;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: repeat(3, 120px);
            grid-auto-flow: column ;
            grid-auto-columns: 120px;
            grid-auto-rows: 80px;

            place-items: normal normal;
            place-content: normal normal;
        }

        div#item {
            border: 4px solid #6e0101;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="item">A</div>
        <div id="item">B</div>
        <div id="item">C</div>
        <div id="item">D</div>
        <div id="item">E</div>
        <div id="item">F</div>
        <div id="item">G</div>
        <div id="item">H</div>
        <div id="item">I</div>
        <div id="item">J</div>
    </div>
</body>
</html>
