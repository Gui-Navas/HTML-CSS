<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid </title>
    <style>
        * {
    margin: 0px;
    padding: 0px;
    box-sizing: border-box;
}

.container {
    display: grid;
    grid-template-rows: 100px 100px 100px;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;
}

.caixa1 {
    background-color: rgba(139, 0, 0, 0.671);
    grid-row: 1 / 2;
    grid-column: 1 / 3;
}

.caixa2 {
    background-color: rgba(0, 0, 255, 0.63);
    grid-row: 2 / 2;
    grid-column: 1 / 4;
}

.caixa3 {
    background-color: rgba(0, 100, 0, 0.788);
    grid-row: 3 / 4;
    grid-column: 1 / 5;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 01</div>
        <div class="caixa2">Caixa 02</div>
        <div class="caixa3">Caixa 03</div>
    </div>
</body>
</html>
